<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>价值投资 - PaulChen</title>
<style>
  body {
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    background: #ffffff;
    color: #000000;
    margin: 0;
    padding: 40px 20px;
    text-align: center;
  }

  /* 返回主页 */
  .back {
    max-width: 760px;
    margin: 0 auto 30px auto;
    text-align: left;
    font-size: 16px;
  }
  .back a {
    color: #0000EE;
    text-decoration: none;
  }
  .back a:hover {
    text-decoration: underline;
  }

  h1 {
    font-size: 26px;
    font-weight: bold;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: 15px;
    color: #666;
    margin: 0 0 36px 0;
  }

  .content {
    max-width: 760px;
    margin: 0 auto;
    text-align: left;
    font-size: 17px;
    line-height: 1.7;
  }

  .content h2 {
    font-size: 18px;
    font-weight: bold;
    margin: 36px 0 14px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid #ddd;
  }

  /* 图表容器 */
  .chart-box {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 16px;
    margin: 16px 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  /* 持仓表 */
  table.holdings {
    width: 100%;
    border-collapse: collapse;
    font-size: 16px;
  }
  table.holdings th,
  table.holdings td {
    padding: 10px 8px;
    border-bottom: 1px solid #eee;
  }
  table.holdings th {
    text-align: left;
    font-weight: bold;
    color: #555;
    border-bottom: 1px solid #ccc;
  }
  /* 占比列：表头和单元格都右对齐 */
  table.holdings th.num,
  table.holdings td.num {
    text-align: right;
  }

  /* 页脚说明 */
  .footer-note {
    max-width: 760px;
    margin: 40px auto 0 auto;
    text-align: left;
    font-size: 14px;
    color: #888;
    border-top: 1px solid #eee;
    padding-top: 16px;
  }
</style>
</head>
<body>

  <div class="back">
    <a href="index.html">← 返回主页</a>
  </div>

  <div class="content">

    <h2>净值曲线</h2>
    <div class="chart-box">
      <canvas id="navChart" width="720" height="360"></canvas>
    </div>

    <h2>前五持仓</h2>
    <table class="holdings">
      <thead>
        <tr>
          <th>标的</th>
          <th class="num">占比</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>中国平安</td><td class="num">26%</td></tr>
        <tr><td>中国移动</td><td class="num">24%</td></tr>
        <tr><td>海尔智家</td><td class="num">10%</td></tr>
        <tr><td>港股通互联网</td><td class="num">9%</td></tr>
        <tr><td>北京银行</td><td class="num">8%</td></tr>
      </tbody>
    </table>

  </div>

  <!-- 页脚说明 -->
  <p class="footer-note">
    数据来源：个人实盘记录
  </p>

  <script>
  const labels = [
    "2026/7/13","2026/7/14","2026/7/15","2026/7/16","2026/7/17",
    "2026/7/20","2026/7/21","2026/7/22","2026/7/23","2026/7/24",
    "2026/7/27","2026/7/28","2026/7/29","2026/7/30","2026/7/31",
    "2026/8/3","2026/8/4","2026/8/5","2026/8/6","2026/8/7",
    "2026/8/10","2026/8/11","2026/8/12","2026/8/13","2026/8/14",
    "2026/8/17","2026/8/18","2026/8/19","2026/8/20","2026/8/21",
    "2026/8/24","2026/8/25","2026/8/26","2026/8/27","2026/8/28",
    "2026/8/31","2026/9/1","2026/9/2","2026/9/3","2026/9/4",
    "2026/9/7","2026/9/8","2026/9/9","2026/9/10","2026/9/11",
    "2026/9/14","2026/9/15","2026/9/16","2026/9/17","2026/9/18",
    "2026/9/21","2026/9/22","2026/9/23","2026/9/24","2026/9/28",
    "2026/9/29","2026/9/30","2026/10/8","2026/10/9"
  ];
  const navs = [
    1.030287531,1.037973459,1.05268178,1.053525021,1.052502074,
    1.084973735,1.075794858,1.082817252,1.085734034,1.07915676,
    1.076289743,1.090987006,1.102872546,1.122338955,1.111081006,
    1.121893835,1.096848217,1.090765828,1.085059442,1.080799005,
    1.087837987,1.078874758,1.073765552,1.073066077,1.067384573,
    1.060157589,1.057398396,1.069118054,1.072300249,1.074495438,
    1.087008571,1.094171966,1.102338955,1.099629527,1.100953829,
    1.106643904,1.119499862,1.117722145,1.129162566,1.135538015,
    1.118883052,1.113566768,1.109711916,1.110296102,1.106008018,
    1.110638927,1.101200166,1.090694222,1.090188278,1.090514515,
    1.090287808,1.096523915,1.090933647,1.089106165,1.084377108,
    1.084717998,1.096837987,1.098875588,1.105869229
  ];

  drawNavChart(labels, navs);

  function drawNavChart(labels, navs) {
    const canvas = document.getElementById('navChart');
    const ctx = canvas.getContext('2d');

    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth;
    const cssH = 360;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.height = cssH + 'px';
    ctx.scale(dpr, dpr);

    const pad = { top: 20, right: 20, bottom: 40, left: 60 };
    const w = cssW - pad.left - pad.right;
    const h = cssH - pad.top - pad.bottom;

    const minVal = Math.min(...navs);
    const maxVal = Math.max(...navs);
    const range = maxVal - minVal || 0.01;
    const yMin = minVal - range * 0.1;
    const yMax = maxVal + range * 0.1;

    const xAt = i => pad.left + (i / (navs.length - 1)) * w;
    const yAt = v => pad.top + (1 - (v - yMin) / (yMax - yMin)) * h;

    ctx.clearRect(0, 0, cssW, cssH);

    // 坐标轴
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top);
    ctx.lineTo(pad.left, pad.top + h);
    ctx.lineTo(pad.left + w, pad.top + h);
    ctx.stroke();

    // 纵轴刻度
    ctx.fillStyle = '#666';
    ctx.font = '12px Georgia';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const yTicks = 5;
    for (let i = 0; i <= yTicks; i++) {
      const v = yMin + (yMax - yMin) * (i / yTicks);
      const y = yAt(v);
      ctx.fillText(v.toFixed(2), pad.left - 8, y);   // 两位小数
      ctx.strokeStyle = '#f0f0f0';
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(pad.left + w, y);
      ctx.stroke();
    }

    // 横轴日期
    ctx.fillStyle = '#666';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const xTickCount = 6;
    for (let i = 0; i < xTickCount; i++) {
      const idx = Math.round((i / (xTickCount - 1)) * (labels.length - 1));
      const x = xAt(idx);
      ctx.fillText(labels[idx].slice(5), x, pad.top + h + 8);
    }

    // 净值折线
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    navs.forEach((v, i) => {
      const x = xAt(i);
      const y = yAt(v);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 下方填充
    ctx.lineTo(xAt(navs.length - 1), pad.top + h);
    ctx.lineTo(xAt(0), pad.top + h);
    ctx.closePath();
    ctx.fillStyle = 'rgba(26,115,232,0.08)';
    ctx.fill();

    // 起点终点圆点
    ctx.fillStyle = '#1a73e8';
    [[0, navs[0]], [navs.length - 1, navs[navs.length - 1]]].forEach(([i, v]) => {
      ctx.beginPath();
      ctx.arc(xAt(i), yAt(v), 3, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  </script>

</body>
</html>
